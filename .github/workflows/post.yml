name: Scheduled poster (Old Money Mood)

# UTC. GitHub cron has no daylight-saving, so ET drifts 1h in winter (acceptable).
#   16:30 UTC = 12:30 ET (summer) / 11:30 ET (winter)
#   23:30 UTC = 19:30 ET (summer) / 18:30 ET (winter)
on:
  schedule:
    - cron: "30 16 * * *"
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Show what would post without publishing"
        type: boolean
        default: false

concurrency:
  group: poster
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Post next item
        id: post
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          python scripts/run_queue.py --account oldmoneymood \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      - name: Commit queue + status
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          git config user.name "poster-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/queue.json content/status.json
          git diff --staged --quiet || git commit -m "poster: publish + status [skip ci]"
          git push

      - name: Alert if fresh content is low
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOW=$(python -c "import json;print(json.load(open('content/status.json')).get('low_queue'))" 2>/dev/null || echo "False")
          REMAIN=$(python -c "import json;print(json.load(open('content/status.json')).get('fresh_remaining'))" 2>/dev/null || echo "?")
          if [ "$LOW" != "True" ]; then
            echo "Fresh remaining: $REMAIN — no alert."
            exit 0
          fi
          EXISTING=$(gh issue list --state open --label queue-low --json number --jq 'length')
          if [ "$EXISTING" != "0" ]; then
            echo "Low-queue issue already open."
            exit 0
          fi
          gh label create queue-low --color FBCA04 --description "Poster queue needs fresh content" 2>/dev/null || true
          gh issue create --label queue-low \
            --title "Poster queue is low — add fresh content" \
            --body "Only $REMAIN fresh item(s) left in \`content/queue.json\`. Until you add more, the poster is recycling top past posts (30-day cooldown). Start a session to top up the queue."
