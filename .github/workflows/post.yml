name: Scheduled poster (Old Money Mood)

# UTC. GitHub cron has no daylight-saving, so ET drifts 1h in winter (acceptable).
# GitHub's free-tier scheduled runs are also often 5-40 min late and occasionally
# skipped under load; the queue's not_before gate means a skipped slot's reel just
# posts at the next run, so content is never lost — only timing drifts.
# 5 daily slots, all inside the same ET calendar day; the schedule fills 3-5/day.
#   12:00 UTC = 08:00 ET summer / 07:00 ET winter
#   14:30 UTC = 10:30 ET summer / 09:30 ET winter
#   17:00 UTC = 13:00 ET summer / 12:00 ET winter
#   20:00 UTC = 16:00 ET summer / 15:00 ET winter
#   23:00 UTC = 19:00 ET summer / 18:00 ET winter
on:
  schedule:
    - cron: "0 12 * * *"
    - cron: "30 14 * * *"
    - cron: "0 17 * * *"
    - cron: "0 20 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Show what would post without publishing"
        type: boolean
        default: false

concurrency:
  group: poster
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Post next item
        id: post
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python scripts/run_queue.py --account oldmoneymood \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      - name: Log follower count
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python scripts/log_followers.py || true

      - name: Commit queue + status + followers
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          git config user.name "poster-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/queue.json content/status.json content/followers.json
          git diff --staged --quiet || git commit -m "poster: publish + status + followers [skip ci]"
          git push

      - name: Notify on posting error
        if: ${{ always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ACTION=$(python -c "import json;print(json.load(open('content/status.json')).get('action',''))" 2>/dev/null || echo "")
          ITEM=$(python -c "import json;print(json.load(open('content/status.json')).get('item_id',''))" 2>/dev/null || echo "")
          if [ "$ACTION" != "failed" ] && [ "$ACTION" != "skipped-bad" ]; then
            echo "No posting error this run (action=$ACTION)."
            exit 0
          fi
          gh label create error --color B60205 --description "Poster hit an error" 2>/dev/null || true
          TITLE="Poster error: $ACTION on $ITEM"
          OPEN=$(gh issue list --state open --label error --search "$ITEM in:title" --json number --jq 'length')
          if [ "$OPEN" != "0" ]; then
            echo "Error issue already open for $ITEM."
            exit 0
          fi
          gh issue create --label error \
            --title "$TITLE" \
            --body "Run [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) reported \`$ACTION\` for item \`$ITEM\`.\n\n\`skipped-bad\` = gave up after 3 attempts and moved on; \`failed\` = will retry next run. Check the run log for the Graph API message, then start a Claude Code session to fix."

      - name: Alert if fresh content is low
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LOW=$(python -c "import json;print(json.load(open('content/status.json')).get('low_queue'))" 2>/dev/null || echo "False")
          REMAIN=$(python -c "import json;print(json.load(open('content/status.json')).get('fresh_remaining'))" 2>/dev/null || echo "?")
          if [ "$LOW" != "True" ]; then
            echo "Fresh remaining: $REMAIN — healthy. Closing any open queue-low issues."
            for N in $(gh issue list --state open --label queue-low --json number --jq '.[].number'); do
              gh issue close "$N" --comment "Queue back to $REMAIN fresh items — auto-closing."
            done
            exit 0
          fi
          EXISTING=$(gh issue list --state open --label queue-low --json number --jq 'length')
          if [ "$EXISTING" != "0" ]; then
            echo "Low-queue issue already open."
            exit 0
          fi
          gh label create queue-low --color FBCA04 --description "Poster queue needs fresh content" 2>/dev/null || true
          gh issue create --label queue-low \
            --title "Poster queue is low — add fresh content" \
            --body "Only $REMAIN fresh item(s) left in \`content/queue.json\`. Until you add more, the poster is recycling top past posts (30-day cooldown). Start a session to top up the queue."
