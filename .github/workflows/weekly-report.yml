name: Weekly report (Old Money Mood)

# Mondays 14:00 UTC (~10:00 ET). Also runnable on demand.
on:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Build report
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python scripts/weekly_report.py > /tmp/report.md

      - name: Open report issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create report --color 0E8A16 --description "Weekly automated report" 2>/dev/null || true
          gh issue create --label report \
            --title "Weekly report — $(date -u +'%Y-%m-%d')" \
            --body-file /tmp/report.md
