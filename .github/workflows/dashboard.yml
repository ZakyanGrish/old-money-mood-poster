name: Rebuild dashboard (Old Money Mood)

# Once a day. The poster workflow also rebuilds it immediately on a failure/skip
# so errors are never stale; this is the routine daily refresh.
on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: poster            # share the poster's lock so commits don't collide
  cancel-in-progress: false

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Build
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python scripts/build_dashboard.py

      - name: Commit
        run: |
          git config user.name "poster-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard.html content/activity.json
          git diff --staged --quiet || git commit -m "dashboard: daily refresh [skip ci]"
          git pull --rebase --autostash -q || true
          git push
